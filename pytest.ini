[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display settings
console_output_style = progress
log_cli = true
log_cli_level = INFO

# Disable warnings that might be distracting
filterwarnings =
    ignore::DeprecationWarning:PyQt5.*:

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external resources
    gui: marks tests that involve GUI components 